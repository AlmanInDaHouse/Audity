[project]
name = "audity-backend"
version = "0.1.0"
description = "Audity API"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "boto3>=1.36.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "google-api-python-client>=2.170.0",
  "google-auth>=2.40.3",
  "httpx>=0.28.0",
  "jinja2>=3.1.4",
  "pydantic-settings>=2.8.0",
  "pyjwt>=2.10.1",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.38",
  "temporalio>=1.10.0",
  "uvicorn[standard]>=0.34.0",
  "weasyprint>=65.0"
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.3",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "types-pyyaml>=6.0.12.20241230"
]

[tool.ruff]
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
follow_imports = "skip"
files = ["app/main.py", "app/models.py", "app/reporting.py", "app/rules.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
