services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audity
      POSTGRES_USER: audity
      POSTGRES_PASSWORD: audity
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audity -d audity"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=audity
      - POSTGRES_PWD=audity
      - POSTGRES_SEEDS=postgres
    ports:
      - "57233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "namespace", "list"]
      interval: 20s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /workspace/backend
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      APP_ENV: dev
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql+asyncpg://audity:audity@postgres:5432/audity
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_SERVER: temporal:7233
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: audity-evidence
      STORAGE_BACKEND: s3
      CATALOG_DIR: /workspace/catalogs
      WORKFLOW_MODE: temporal
      OIDC_ISSUER: https://localhost:5443/api
      API_BASE_URL: https://localhost:5443/api
      ENTERPRISE_FEATURES_ENABLED: "false"
      FEATURE_AUTH_ENTERPRISE: "false"
      FEATURE_SCIM: "false"
      FEATURE_SECRET_STORE: "false"
      FEATURE_UPLOAD_AV_SCAN: "false"
      FEATURE_SIGNING: "false"
      FEATURE_TSA: "false"
      FEATURE_RBAC_ABAC: "false"
      FEATURE_APPROVALS: "false"
      FEATURE_REPORTING_PACKAGE: "false"
      FEATURE_PRICING: "false"
      SECRET_STORE_BACKEND: env
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      TELEMETRY_ENABLED: "false"
      OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    ports:
      - "58000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    working_dir: /workspace/worker
    command: ["uv", "run", "python", "-m", "worker_service.main"]
    env_file:
      - .env
    environment:
      APP_ENV: dev
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql+asyncpg://audity:audity@postgres:5432/audity
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_SERVER: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: audit-run-queue
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: audity-evidence
      STORAGE_BACKEND: s3
      CATALOG_DIR: /workspace/catalogs
      WORKFLOW_MODE: temporal
      OIDC_ISSUER: https://localhost:5443/api
      API_BASE_URL: https://localhost:5443/api
      ENTERPRISE_FEATURES_ENABLED: "false"
      FEATURE_UPLOAD_AV_SCAN: "false"
      FEATURE_SIGNING: "false"
      SECRET_STORE_BACKEND: env
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      TELEMETRY_ENABLED: "false"
      OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./:/workspace
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    working_dir: /workspace/frontend
    command: ["npm", "run", "dev", "--", "-p", "3000", "-H", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://localhost:5443/api
    volumes:
      - ./:/workspace
    ports:
      - "53000:3000"

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "5080:80"
      - "5443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["idp"]
    command:
      - start-dev
      - --http-port=8080
      - --hostname-strict=false
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "58080:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  vault:
    image: hashicorp/vault:1.17
    profiles: ["vault"]
    cap_add:
      - IPC_LOCK
    command:
      - vault
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - "58200:8200"

  clamav:
    image: clamav/clamav:latest
    profiles: ["av"]
    ports:
      - "53310:3310"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    profiles: ["obs"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "54317:4317"
      - "54318:4318"

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "59090:9090"

  loki:
    image: grafana/loki:3.4.2
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "53100:3100"

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "53001:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  postgres-backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGPASSWORD: audity
    volumes:
      - backup_data:/backups
    command:
      - sh
      - -c
      - >-
        while true; do
          ts=$$(date +%Y%m%d%H%M%S);
          pg_dump -h postgres -U audity -d audity -F c -f /backups/audity-$$ts.dump;
          find /backups -name '*.dump' -mtime +7 -delete;
          sleep 3600;
        done
    depends_on:
      postgres:
        condition: service_healthy

  minio-backup:
    image: minio/mc:latest
    profiles: ["backup"]
    volumes:
      - backup_data:/backups
    command:
      - sh
      - -c
      - >-
        while true; do
          mc alias set src http://minio:9000 minioadmin minioadmin;
          mc mirror --overwrite src/audity-evidence /backups/minio;
          sleep 3600;
        done
    depends_on:
      minio:
        condition: service_healthy

  waf:
    image: nginx:1.27-alpine
    profiles: ["waf"]
    ports:
      - "5081:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
  backup_data:
