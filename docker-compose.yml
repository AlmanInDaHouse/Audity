services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audity
      POSTGRES_USER: audity
      POSTGRES_PASSWORD: audity
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audity -d audity"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=audity
      - POSTGRES_PWD=audity
      - POSTGRES_SEEDS=postgres
    ports:
      - "57233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "namespace", "list"]
      interval: 20s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /workspace/backend
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      APP_ENV: dev
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql+asyncpg://audity:audity@postgres:5432/audity
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_SERVER: temporal:7233
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: audity-evidence
      STORAGE_BACKEND: s3
      CATALOG_DIR: /workspace/catalogs
      WORKFLOW_MODE: temporal
      OIDC_ISSUER: https://localhost:5443/api
      API_BASE_URL: https://localhost:5443/api
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    ports:
      - "58000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    working_dir: /workspace/worker
    command: ["uv", "run", "python", "-m", "worker_service.main"]
    env_file:
      - .env
    environment:
      APP_ENV: dev
      PYTHONPATH: /workspace
      DATABASE_URL: postgresql+asyncpg://audity:audity@postgres:5432/audity
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_SERVER: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: audit-run-queue
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: audity-evidence
      STORAGE_BACKEND: s3
      CATALOG_DIR: /workspace/catalogs
      WORKFLOW_MODE: temporal
      OIDC_ISSUER: https://localhost:5443/api
      API_BASE_URL: https://localhost:5443/api
    volumes:
      - ./:/workspace
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    working_dir: /workspace/frontend
    command: ["npm", "run", "dev", "--", "-p", "3000", "-H", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://localhost:5443/api
    volumes:
      - ./:/workspace
    ports:
      - "53000:3000"

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "5080:80"
      - "5443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
