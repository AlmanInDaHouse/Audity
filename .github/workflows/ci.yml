name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start required services
        run: |
          docker compose down -v || true
          docker compose up -d --build postgres redis minio temporal api worker
          docker compose ps

      - name: Run migrations and seed data
        run: |
          docker compose exec -T api uv run alembic upgrade head
          docker compose exec -T api uv run python -m app.scripts.seed_data

      - name: Lint
        run: |
          docker compose exec -T api uv run ruff check app tests tests_integration
          docker compose exec -T api uv run mypy

      - name: Unit tests (sqlite)
        run: docker compose exec -T api uv run pytest -q tests

      - name: Integration tests (postgres live)
        run: docker compose exec -T api uv run pytest -q tests_integration

      - name: Demo audit and verify no git artifacts
        shell: bash
        run: |
          before="$(git status --porcelain)"
          docker compose exec -T api uv run python -m app.scripts.demo_audit
          after="$(git status --porcelain)"
          if [[ "$before" != "$after" ]]; then
            echo "Repository changed after demo_audit"
            echo "--- before ---"
            echo "$before"
            echo "--- after ---"
            echo "$after"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Teardown
        if: always()
        run: docker compose down -v
