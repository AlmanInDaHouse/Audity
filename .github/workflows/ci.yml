name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug workspace paths
        shell: bash
        run: |
          ls -la
          ls -la .env.ci .env.example || true

      - name: Prepare .env for compose
        shell: bash
        run: |
          if [[ -f .env.ci ]]; then
            cp .env.ci .env
            echo "Prepared .env from .env.ci"
          elif [[ -f .env.example ]]; then
            cp .env.example .env
            echo "Prepared .env from .env.example"
          else
            echo "Missing .env.ci and .env.example" >&2
            exit 1
          fi

      - name: Build and start required services
        run: |
          docker compose down -v || true
          docker compose up -d --build postgres redis minio temporal api worker
          docker compose ps

      - name: Migration idempotency smoke (clean + precreated roleenum)
        shell: bash
        run: |
          docker compose exec -T postgres psql -U audity -d postgres -c "DROP DATABASE IF EXISTS audity_mig_clean;"
          docker compose exec -T postgres psql -U audity -d postgres -c "CREATE DATABASE audity_mig_clean;"
          docker compose exec -T api sh -lc "DATABASE_URL=postgresql+asyncpg://audity:audity@postgres:5432/audity_mig_clean uv run alembic upgrade head"

          docker compose exec -T postgres psql -U audity -d postgres -c "DROP DATABASE IF EXISTS audity_mig_dirty;"
          docker compose exec -T postgres psql -U audity -d postgres -c "CREATE DATABASE audity_mig_dirty;"
          docker compose exec -T postgres psql -U audity -d audity_mig_dirty -c "CREATE TYPE roleenum AS ENUM ('org_admin','auditor','client_viewer');"
          docker compose exec -T api sh -lc "DATABASE_URL=postgresql+asyncpg://audity:audity@postgres:5432/audity_mig_dirty uv run alembic upgrade head"

      - name: Run migrations and seed data
        run: |
          docker compose exec -T api uv run alembic upgrade head
          docker compose exec -T api uv run python -m app.scripts.seed_data

      - name: Lint
        run: |
          docker compose exec -T api uv run ruff check app tests tests_integration
          docker compose exec -T api uv run mypy

      - name: Unit tests (sqlite)
        run: docker compose exec -T api uv run pytest -q tests

      - name: Integration tests (postgres live)
        run: docker compose exec -T api uv run pytest -q tests_integration

      - name: Demo audit and verify no git artifacts
        shell: bash
        run: |
          before="$(git status --porcelain)"
          docker compose exec -T api uv run python -m app.scripts.demo_audit
          after="$(git status --porcelain)"
          if [[ "$before" != "$after" ]]; then
            echo "Repository changed after demo_audit"
            echo "--- before ---"
            echo "$before"
            echo "--- after ---"
            echo "$after"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Teardown
        if: always()
        run: docker compose down -v
