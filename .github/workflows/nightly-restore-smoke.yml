name: Nightly Restore Smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  restore-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose down -v || true
          docker compose up -d --build postgres redis minio temporal api worker

      - name: Migrate and seed
        run: |
          docker compose exec -T api uv run alembic upgrade head
          docker compose exec -T api uv run python -m app.scripts.seed_data

      - name: Backup and restore smoke
        shell: bash
        run: |
          mkdir -p backups/nightly/minio
          docker compose exec -T postgres sh -c "pg_dump -U audity -d audity -F c" > backups/nightly/audity.dump
          cat backups/nightly/audity.dump | docker compose exec -T postgres sh -c "pg_restore -U audity -d audity --clean --if-exists"
          docker compose exec -T api uv run python -m app.scripts.demo_audit

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Teardown
        if: always()
        run: docker compose down -v
